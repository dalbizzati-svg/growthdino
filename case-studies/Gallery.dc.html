<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
  <sc-for list="{{ groups }}" as="group" hint-placeholder-count="2">
    <div style="margin-bottom:clamp(28px,4vw,44px)">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <span style="font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#B04A2E">{{ group.label }}</span>
        <span style="height:1px;flex:1;background:#D6CEBC"></span>
        <span style="font-family:'Space Mono',monospace;font-size:12px;color:#9A9384">{{ group.count }}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:clamp(12px,1.8vw,18px)">
        <sc-for list="{{ group.items }}" as="item" hint-placeholder-count="4">
          <figure style="margin:0;display:flex;flex-direction:column;gap:10px">
            <button onClick="{{ item.open }}" aria-label="{{ item.caption }}" style="position:relative;padding:0;border:1px solid #D6CEBC;border-radius:3px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;background:#EDE7D9;display:block;width:100%" style-hover="border-color:#B04A2E">
              <sc-if value="{{ item.isImage }}" hint-placeholder-val="{{ true }}">
                <img src="{{ item.src }}" alt="{{ item.caption }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block" />
              </sc-if>
              <sc-if value="{{ item.isVideo }}" hint-placeholder-val="{{ false }}">
                <video src="{{ item.src }}" muted preload="metadata" playsinline style="width:100%;height:100%;object-fit:cover;display:block;background:#16140E"></video>
                <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                  <span style="width:46px;height:46px;border-radius:50%;background:rgba(22,20,14,0.62);display:flex;align-items:center;justify-content:center;color:#F4F0E6;font-size:16px;padding-left:3px">►</span>
                </span>
              </sc-if>
            </button>
            <figcaption style="font-family:'Space Mono',monospace;font-size:11.5px;color:#7A7364;line-height:1.5">{{ item.caption }}</figcaption>
          </figure>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:1000;background:rgba(15,13,9,0.92);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,56px)">
      <button onClick="{{ close }}" aria-label="Close" style="position:absolute;top:clamp(14px,2vw,24px);right:clamp(14px,2vw,24px);width:44px;height:44px;border-radius:50%;border:1px solid rgba(244,240,230,0.28);background:rgba(244,240,230,0.06);color:#F4F0E6;font-family:'Space Mono',monospace;font-size:22px;line-height:1;cursor:pointer">×</button>
      <button onClick="{{ prevStop }}" aria-label="Previous" style="position:absolute;left:clamp(10px,2vw,28px);top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(244,240,230,0.28);background:rgba(244,240,230,0.06);color:#F4F0E6;font-size:24px;line-height:1;cursor:pointer">‹</button>
      <button onClick="{{ nextStop }}" aria-label="Next" style="position:absolute;right:clamp(10px,2vw,28px);top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(244,240,230,0.28);background:rgba(244,240,230,0.06);color:#F4F0E6;font-size:24px;line-height:1;cursor:pointer">›</button>
      <figure onClick="{{ stop }}" style="margin:0;max-width:min(1080px,90vw);display:flex;flex-direction:column;align-items:center;gap:16px">
        <sc-if value="{{ curImage }}" hint-placeholder-val="{{ true }}">
          <img src="{{ cur.src }}" alt="{{ cur.caption }}" style="max-width:100%;max-height:80vh;object-fit:contain;border-radius:3px;display:block" />
        </sc-if>
        <sc-if value="{{ curVideo }}" hint-placeholder-val="{{ false }}">
          <video src="{{ cur.src }}" controls autoplay playsinline style="max-width:100%;max-height:80vh;border-radius:3px;display:block;background:#000"></video>
        </sc-if>
        <figcaption style="display:flex;align-items:center;gap:14px;font-family:'Space Mono',monospace;font-size:13px;color:rgba(244,240,230,0.82);text-align:center">
          <span>{{ cur.caption }}</span>
          <span style="color:rgba(244,240,230,0.4)">{{ counter }}</span>
        </figcaption>
      </figure>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:640},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{type:string,kind:string,src:string,caption:string}&gt;&quot;},&quot;caseName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, idx: 0 };

  track(name, params) {
    if (typeof window !== 'undefined' && typeof window.gtag === 'function') window.gtag('event', name, params || {});
  }
  componentDidMount() {
    this._key = (e) => {
      if (!this.state.open) return;
      if (e.key === 'Escape') this.setState({ open: false });
      else if (e.key === 'ArrowRight') this.step(1);
      else if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { if (this._key) window.removeEventListener('keydown', this._key); }
  step(d) {
    const n = (this.flat || []).length || 1;
    this.setState(s => ({ idx: (s.idx + d + n) % n }));
  }
  openAt(i, item) {
    this.setState({ open: true, idx: i });
    this.track('case_study_media_viewed', { case_study_name: this.props.caseName || '', media_type: item.kind === 'video' ? 'video' : 'image' });
  }
  renderVals() {
    const items = Array.isArray(this.props.items) ? this.props.items : [];
    const order = ['Video', 'Ads', 'Email', 'Print', 'Web'];
    const flat = items.map((it, i) => ({ ...it, i }));
    this.flat = flat;
    const map = {};
    flat.forEach(it => { (map[it.type] = map[it.type] || []).push(it); });
    const groups = order.filter(t => map[t]).map(t => ({
      label: t,
      count: String(map[t].length).padStart(2, '0'),
      items: map[t].map(it => ({
        caption: it.caption,
        src: it.src,
        isVideo: it.kind === 'video',
        isImage: it.kind !== 'video',
        open: () => this.openAt(it.i, it)
      }))
    }));
    const cur = flat[this.state.idx] || {};
    return {
      groups,
      open: this.state.open,
      cur,
      curVideo: cur.kind === 'video',
      curImage: cur.kind !== 'video',
      counter: flat.length ? (this.state.idx + 1) + ' / ' + flat.length : '',
      close: () => this.setState({ open: false }),
      stop: (e) => e.stopPropagation(),
      prevStop: (e) => { e.stopPropagation(); this.step(-1); },
      nextStop: (e) => { e.stopPropagation(); this.step(1); }
    };
  }
}
</script>
</body>
</html>
