<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Archivo',Helvetica,Arial,sans-serif">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px">
    <div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8A8A80">The creative — {{ counter }}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6B6B63;margin-top:6px">{{ subtitle }}</div>
    </div>
    <div style="display:flex;gap:8px">
      <button onClick="{{ prev }}" aria-label="Previous" style="width:44px;height:44px;background:transparent;border:1.5px solid #35352F;color:#FCFBF6;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;cursor:pointer" style-hover="border-color:#F7D648;color:#F7D648">←</button>
      <button onClick="{{ next }}" aria-label="Next" style="width:44px;height:44px;background:#F7D648;border:none;color:#131311;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;cursor:pointer" style-hover="background:#FCFBF6">→</button>
    </div>
  </div>

  <div style="overflow:hidden">
    <div style="display:flex;gap:16px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform:{{ track }}">
      <sc-for list="{{ items }}" as="m" hint-placeholder-count="3">
        <div onClick="{{ m.openLightbox }}" style="width:340px;flex:0 0 340px;background:#1C1C18;border:1px solid #26261F;cursor:pointer">
          <div style="aspect-ratio:4/5;background:#131311;position:relative;overflow:hidden">
            <span style="position:absolute;top:10px;left:10px;z-index:1;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:#F7D648;color:#131311;padding:5px 9px">{{ m.type }}</span>
            <div style="position:absolute;top:10px;right:10px;z-index:1;width:30px;height:30px;background:rgba(19,19,17,.7);display:flex;align-items:center;justify-content:center;pointer-events:none">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FCFBF6" stroke-width="2.5" stroke-linecap="round"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"></path></svg>
            </div>
            <img src="{{ m.thumb }}" alt="{{ m.caption }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block" />
            <sc-if value="{{ m.isVideo }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                <div style="width:52px;height:52px;border-radius:50%;background:rgba(19,19,17,.72);display:flex;align-items:center;justify-content:center">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="#FCFBF6"><path d="M8 5v14l11-7z"></path></svg>
                </div>
              </div>
            </sc-if>
          </div>
          <div style="padding:16px;border-top:1px solid #26261F">
            <div style="font-size:15px;line-height:1.4;color:#FCFBF6">{{ m.caption }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;gap:6px;margin-top:16px;flex-wrap:wrap">
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
      <span onClick="{{ d.on }}" style="width:30px;height:4px;cursor:pointer;background:{{ d.bg }}"></span>
    </sc-for>
  </div>

  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeLightbox }}" style="position:fixed;inset:0;background:rgba(10,10,8,.94);z-index:1000;display:flex;align-items:center;justify-content:center;padding:40px">
      <button onClick="{{ closeLightbox }}" aria-label="Close" style="position:absolute;top:24px;right:24px;width:44px;height:44px;background:transparent;border:1.5px solid #35352F;color:#FCFBF6;font-size:20px;line-height:1;cursor:pointer;z-index:1002">✕</button>
      <button onClick="{{ lightboxPrev }}" aria-label="Previous" style="position:absolute;left:24px;top:50%;transform:translateY(-50%);width:48px;height:48px;background:transparent;border:1.5px solid #35352F;color:#FCFBF6;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;cursor:pointer;z-index:1002">←</button>
      <button onClick="{{ lightboxNext }}" aria-label="Next" style="position:absolute;right:24px;top:50%;transform:translateY(-50%);width:48px;height:48px;background:transparent;border:1.5px solid #35352F;color:#FCFBF6;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;cursor:pointer;z-index:1002">→</button>
      <div onClick="{{ stop }}" style="max-width:92vw;max-height:88vh;display:flex;flex-direction:column;align-items:center;gap:14px">
        <div onWheel="{{ onWheelZoom }}" style="width:88vw;max-width:1040px;height:72vh;overflow:auto;display:flex;align-items:center;justify-content:center;background:#000">
          <sc-if value="{{ lightboxIsVideo }}" hint-placeholder-val="{{ false }}">
            <video src="{{ lightboxSrc }}" poster="{{ lightboxPoster }}" controls autoplay playsinline style="max-width:88vw;max-height:72vh;display:block;background:#000;transform:scale({{ zoom }});transform-origin:center center"></video>
          </sc-if>
          <sc-if value="{{ lightboxIsImage }}" hint-placeholder-val="{{ true }}">
            <img src="{{ lightboxSrc }}" alt="{{ lightboxCaption }}" onClick="{{ toggleZoom }}" style="max-width:88vw;max-height:72vh;display:block;object-fit:contain;transform:scale({{ zoom }});transform-origin:center center;cursor:{{ zoomCursor }}" />
          </sc-if>
        </div>
        <div onClick="{{ stop }}" style="display:flex;align-items:center;gap:10px">
          <button onClick="{{ zoomOut }}" aria-label="Zoom out" style="width:34px;height:34px;background:transparent;border:1.5px solid #35352F;color:#FCFBF6;font-size:18px;line-height:1;cursor:pointer">−</button>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A8A80;min-width:42px;text-align:center">{{ zoomLabel }}</span>
          <button onClick="{{ zoomIn }}" aria-label="Zoom in" style="width:34px;height:34px;background:transparent;border:1.5px solid #35352F;color:#FCFBF6;font-size:18px;line-height:1;cursor:pointer">+</button>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#DAD8D0;text-align:center">{{ lightboxCaption }}</div>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:620},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{type:string,kind:string,src:string,caption:string}[]&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Drop the real assets into these slots — ads, emails, print, web.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ZOOM_MIN = 1;
const ZOOM_MAX = 3;
const ZOOM_STEP = 0.5;
const clampZoom = z => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, +z.toFixed(2)));

class Component extends DCLogic {
  state = { i: 0, perView: 3, lightbox: null, zoom: 1 };

  componentDidMount() {
    this.fit();
    this._on = () => this.fit();
    window.addEventListener('resize', this._on);
    this._key = (e) => { if (e.key === 'Escape' && this.state.lightbox !== null) this.setState({ lightbox: null, zoom: 1 }); };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._on);
    window.removeEventListener('keydown', this._key);
  }
  fit() {
    const w = window.innerWidth;
    const perView = w < 720 ? 1 : w < 1080 ? 2 : 3;
    if (perView !== this.state.perView) this.setState({ perView, i: 0 });
  }

  renderVals() {
    const items = (this.props.items || []).map((m, idx) => {
      const isVideo = m.kind === 'video';
      return {
        type: m.type || 'Creative',
        caption: m.caption || '',
        src: m.src || '',
        poster: m.poster || '',
        thumb: isVideo ? (m.poster || m.src || '') : (m.src || ''),
        isVideo,
        isImage: !isVideo,
        openLightbox: (e) => { e.stopPropagation(); this.setState({ lightbox: idx, zoom: 1 }); }
      };
    });
    const max = Math.max(0, items.length - this.state.perView);
    const i = Math.min(this.state.i, max);
    const clamp = n => Math.min(max, Math.max(0, n));
    const lb = this.state.lightbox;
    const lbItem = lb !== null && items[lb] ? items[lb] : null;
    const zoom = this.state.zoom;
    return {
      items,
      counter: items.length ? `${i + 1}–${Math.min(items.length, i + this.state.perView)} of ${items.length}` : '—',
      subtitle: this.props.subtitle || 'Drop the real assets into these slots — ads, emails, print, web.',
      track: `translateX(${i * -356}px)`,
      prev: () => this.setState(s => ({ i: clamp(s.i - 1) })),
      next: () => this.setState(s => ({ i: clamp(s.i + 1) })),
      dots: Array.from({ length: max + 1 }, (_, n) => ({
        bg: i === n ? '#F7D648' : '#35352F',
        on: () => this.setState({ i: n })
      })),
      lightboxOpen: !!lbItem,
      lightboxIsVideo: lbItem ? lbItem.isVideo : false,
      lightboxIsImage: lbItem ? lbItem.isImage : true,
      lightboxSrc: lbItem ? lbItem.src : '',
      lightboxPoster: lbItem ? lbItem.poster : '',
      lightboxCaption: lbItem ? lbItem.caption : '',
      closeLightbox: () => this.setState({ lightbox: null, zoom: 1 }),
      lightboxPrev: (e) => { e.stopPropagation(); this.setState(s => ({ lightbox: (s.lightbox - 1 + items.length) % items.length, zoom: 1 })); },
      lightboxNext: (e) => { e.stopPropagation(); this.setState(s => ({ lightbox: (s.lightbox + 1) % items.length, zoom: 1 })); },
      zoom,
      zoomLabel: `${Math.round(zoom * 100)}%`,
      zoomCursor: zoom > ZOOM_MIN ? 'zoom-out' : 'zoom-in',
      zoomIn: (e) => { e.stopPropagation(); this.setState(s => ({ zoom: clampZoom(s.zoom + ZOOM_STEP) })); },
      zoomOut: (e) => { e.stopPropagation(); this.setState(s => ({ zoom: clampZoom(s.zoom - ZOOM_STEP) })); },
      toggleZoom: (e) => { e.stopPropagation(); this.setState(s => ({ zoom: s.zoom > ZOOM_MIN ? ZOOM_MIN : 2 })); },
      onWheelZoom: (e) => {
        if (!e.deltaY || !e.ctrlKey) return;
        e.preventDefault();
        e.stopPropagation();
        this.setState(s => ({ zoom: clampZoom(s.zoom - Math.sign(e.deltaY) * 0.25) }));
      },
      stop: (e) => e.stopPropagation()
    };
  }
}

</script>
</body>
</html>
